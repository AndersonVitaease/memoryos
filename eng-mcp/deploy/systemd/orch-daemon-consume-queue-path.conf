# RD-ORCH-ENV-01: a fila real do HOST é /opt/mission-events/orchestrator-queue.jsonl
# (o default /data/orchestrator-queue.jsonl vale para o CONTAINER, onde o mesmo
# arquivo é bindado em /data). Rollback: remover este drop-in + daemon-reload.
# Fonte versionada: instalar em
# /etc/systemd/system/orch-daemon-consume.service.d/queue-path.conf
[Service]
Environment=ENG_MCP_QUEUE_PATH=/opt/mission-events/orchestrator-queue.jsonl
