<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <strong>MemoryOS Bridge</strong>
    <span id="status-dot" class="dot dot-off"></span>
  </div>
  <div id="auth-status" class="muted">Verificando…</div>
  <div id="session-info" class="session-info hidden">
    <div><span class="label">Site:</span> <span id="session-site"></span></div>
    <div><span class="label">Expira:</span> <span id="session-expires"></span></div>
  </div>
  <button id="connect-btn" class="btn btn-primary" disabled>Conectar este site</button>
  <button id="discover-btn" class="btn btn-secondary hidden">Descobrir via extensao</button>
  <button id="disconnect-btn" class="btn btn-danger hidden">Desconectar</button>
  <div id="discovery-status" class="discovery-status hidden"></div>
  <div id="exec-panel" class="exec-panel hidden">
    <div class="section-title">Executar capability</div>
    <select id="cap-select" class="select"></select>
    <input id="cap-input" class="input" placeholder="Termo de busca" />
    <button id="exec-btn" class="btn btn-primary" disabled>Executar</button>
    <div id="exec-status" class="discovery-status hidden"></div>
  </div>
  <div id="error-msg" class="error hidden"></div>
  <div class="footer muted">Abra o app MemoryOS no Chrome para autenticar.</div>
  <script src="popup.js"></script>
</body>
</html>
